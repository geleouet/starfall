<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfall — Progress</title>
<style>
  :root{
    --ink:#0F1218; --ink2:#161B24; --ink3:#1E2531; --line:#2A3341;
    --paper:#EDE4D3; --paper-dim:#A9A296; --paper-faint:#6E7684;
    --indigo:#5B7FB5; --coral:#D9736B; --ochre:#B5793A; --blade:#EAF2F8;
    --green:#6FA88B; --amber:#D8A86A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 700px at 75% -8%, #23304A 0%, transparent 62%),
      radial-gradient(900px 600px at 8% 108%, #3A2530 0%, transparent 58%),
      var(--ink);
    color:var(--paper);
    font:15px/1.65 Georgia,"Iowan Old Style","Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:56px 28px 120px}
  a{color:var(--indigo)}

  /* ---- header ---- */
  header{border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:40px}
  h1{
    font-size:44px;font-weight:400;letter-spacing:.14em;margin:0 0 6px;
    text-transform:uppercase;
  }
  h1 .dot{color:var(--coral)}
  .tagline{color:var(--paper-dim);font-style:italic;font-size:16px;margin:0 0 22px}
  .metaline{
    display:flex;flex-wrap:wrap;gap:10px 28px;
    font-family:ui-monospace,Consolas,monospace;font-size:11.5px;
    letter-spacing:.06em;color:var(--paper-faint);text-transform:uppercase;
  }
  .metaline b{color:var(--paper-dim);font-weight:400}

  /* ---- generic section ---- */
  section{margin:0 0 52px}
  h2{
    font-size:12px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;
    color:var(--paper-faint);margin:0 0 18px;padding-bottom:9px;
    border-bottom:1px solid var(--line);
  }
  h2 .count{color:var(--line);margin-left:8px}

  /* ---- now panel ---- */
  .now{
    background:linear-gradient(100deg,var(--ink3),var(--ink2));
    border:1px solid var(--line);border-left:3px solid var(--coral);
    border-radius:3px;padding:22px 26px;
  }
  .now .k{
    font-family:ui-monospace,Consolas,monospace;font-size:10.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--coral);margin-bottom:8px;
  }
  .now .v{font-size:21px;margin-bottom:8px}
  .now .d{color:var(--paper-dim);font-size:14.5px}

  /* ---- pipeline ---- */
  .pipe{display:grid;gap:2px}
  .step{
    display:grid;grid-template-columns:38px 1fr auto;gap:18px;align-items:start;
    padding:15px 18px;background:var(--ink2);border:1px solid var(--line);
    border-radius:3px;
  }
  .step.active{background:var(--ink3);border-color:#3C4A5E}
  .step.done{opacity:.72}
  .step .n{
    font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--paper-faint);
    padding-top:3px;
  }
  .step .nm{font-size:16px;margin-bottom:3px}
  .step .sm{color:var(--paper-dim);font-size:13.5px}
  .step .sm:empty{display:none}

  .chip{
    font-family:ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;padding:4px 10px;border-radius:2px;white-space:nowrap;
    border:1px solid currentColor;
  }
  .chip.pending{color:var(--paper-faint)}
  .chip.building{color:var(--amber)}
  .chip.review{color:var(--indigo)}
  .chip.passed{color:var(--green)}
  .chip.failed{color:var(--coral)}
  .chip.blocked{color:var(--coral)}

  /* ---- decisions ---- */
  .dec{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:2px}
  .dec div{
    background:var(--ink2);border:1px solid var(--line);border-radius:3px;padding:14px 16px;
  }
  .dec .k{
    font-family:ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--paper-faint);margin-bottom:6px;
  }
  .dec .v{font-size:15px;color:var(--paper)}
  .dec .w{font-size:13px;color:var(--paper-dim);margin-top:5px;font-style:italic}

  /* ---- refs ---- */
  .refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .refs a{display:block;border:1px solid var(--line);border-radius:2px;overflow:hidden;line-height:0}
  .refs img{width:100%;height:190px;object-fit:cover;display:block;filter:saturate(.95)}

  /* ---- log ---- */
  .entry{
    border:1px solid var(--line);border-radius:3px;background:var(--ink2);
    margin-bottom:14px;overflow:hidden;
  }
  .entry > .head{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    padding:13px 18px;border-bottom:1px solid var(--line);background:var(--ink3);
  }
  .entry .ts{
    font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--paper-faint);
    letter-spacing:.08em;
  }
  .entry .ti{font-size:16px;flex:1;min-width:220px}
  .entry .body{padding:18px}
  .entry .body p{margin:0 0 12px}
  .entry .body p:last-child{margin-bottom:0}
  .entry img.sheet{
    width:100%;display:block;border:1px solid var(--line);border-radius:2px;margin:6px 0 16px;
    background:var(--ink);
  }
  .crit{
    border-left:2px solid var(--coral);padding:2px 0 2px 16px;margin:14px 0;
    color:var(--paper-dim);
  }
  .crit b{color:var(--coral);font-weight:400;font-family:ui-monospace,Consolas,monospace;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:5px}
  .fix{border-left-color:var(--green)}
  .fix b{color:var(--green)}
  ul{margin:0 0 12px;padding-left:20px}
  li{margin-bottom:5px}
  code{
    font-family:ui-monospace,Consolas,monospace;font-size:12.5px;
    background:var(--ink);padding:2px 6px;border-radius:2px;color:var(--amber);
  }
  .empty{color:var(--paper-faint);font-style:italic}
  footer{
    margin-top:70px;padding-top:22px;border-top:1px solid var(--line);
    color:var(--paper-faint);font-size:12.5px;
  }
</style>
</head>

  const d = DATA;
  const done = d.systems.filter(s=>s.status==='passed').length;

  const head = `

    <p class="tagline">${esc(d.tagline)}</p>

      <span><b>Systems</b> ${done} / ${d.systems.length} passed</span>
      <span><b>Rubric</b> STYLE.md + 8 reference images</span>
      <span><b>Blocked</b> ${d.blocked.length ? d.blocked.length + ' item(s)' : 'nothing'}</span>
    </div>
  </header>`;

  const now = `
  <section>
    <div class="now">
      <div class="k">${esc(d.now.label)}</div>
      <div class="v">${esc(d.now.title)}</div>
      <div class="d">${d.now.detail}</div>
    </div>
  </section>`;

  const blocked = d.blocked.length ? `
  <section>
    <h2>Needs your input</h2>
    ${d.blocked.map(b=>`<div class="entry"><div class="head">
        <span class="chip blocked">blocked</span><span class="ti">${esc(b.title)}</span></div>
        <div class="body">${b.body}</div></div>`).join('')}
  </section>` : '';

  const pipe = `
  <section>
    <h2>Pipeline<span class="count">— built in order, each gated on review</span></h2>

      ${d.systems.map(s=>`

          <div>
            <div class="nm">${esc(s.name)}</div>
            <div class="sm">${esc(s.summary||'')}</div>
          </div>
          <div>
            <span class="chip ${s.status}">${esc(s.status)}${s.passes?` · ${s.passes} pass${s.passes>1?'es':''}`:''}</span>
          </div>
        </div>`).join('')}
    </div>
  </section>`;

  const dec = `
  <section>
    <h2>Locked decisions</h2>
    <div class="dec">
      ${d.decisions.map(x=>`<div>
        <div class="k">${esc(x.k)}</div>
        <div class="v">${esc(x.v)}</div>

  <section>
    <h2>Reference corpus<span class="count">— ground truth, beats STYLE.md on disagreement</span></h2>

      ${d.refs.map(r=>`<a href="${encodeURI(r)}" target="_blank"><img src="${encodeURI(r)}" alt="reference" loading="lazy"></a>`).join('')}

  </section>`;

  const log = `
  <section>
    <h2>Log<span class="count">— newest first</span></h2>
