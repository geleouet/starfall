// Lanceur bureau (backend LWJGL3).

apply plugin: 'application'

application {
    mainClass = 'com.starfall.lwjgl3.Lwjgl3Launcher'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// L'atlas genere est embarque comme ressource : Gdx.files.internal le trouve
// aussi bien depuis « gradlew run » que depuis le jar produit par « dist ».
sourceSets.main.resources.srcDir rootProject.file('assets')
tasks.named('processResources') {
    dependsOn ':core:generateAtlas'
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl') {
            details.useVersion lwjglVersion
        }
    }
}

// Permet : gradlew :lwjgl3:run --args="--screenshot captures/m1 --size 1280x720"
tasks.named('run', JavaExec) {
    standardInput = System.in
    // On absorbe le code de sortie pour pouvoir le NOMMER, puis on refait échouer la tâche.
    //
    // Le jeu distingue ses échecs : 1 plantage, 2 ligne de commande invalide, 3 capture non
    // conforme à la taille demandée. Gradle les écrasait tous par un « Process finished with
    // non-zero exit value 1 » : la distinction existait dans le code, était testée, et
    // n'arrivait jamais jusqu'à celui qui lance le jeu.
    //
    // Le code du processus reste 1 — c'est Gradle qui sort, pas le jeu, et le plomber jusqu'au
    // .bat demanderait de capturer la sortie dans un fichier, donc de perdre l'affichage en
    // direct d'un lanceur interactif. Ce qui compte est que le message dise lequel des trois.
    ignoreExitValue = true
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // Les chemins relatifs (ex. --screenshot captures/m1) partent de la racine du projet.
    workingDir = rootProject.projectDir

    // Le code du jeu est aussi ÉCRIT, parce que le nommer ne suffisait pas.
    //
    // Gradle sort 1 dès qu'une tâche échoue, quel que soit le code du processus : run.bat renvoyait
    // donc 1 pour les trois cas. La distinction existait dans le jeu, était testée, était affichée
    // -- et restait illisible pour un script, c'est-à-dire pour le seul appelant que des codes de
    // sortie intéressent. Un fichier d'un octet suffit à la lui rendre, sans capturer la sortie du
    // jeu ni perdre son affichage en direct.
    //
    // Efface avant chaque exécution -- mais ce n'est PAS ce qui protège d'une valeur périmée, et il
    // faut le dire : si la compilation échoue, cette tâche ne démarre jamais, donc ce doFirst non
    // plus. C'est run.bat qui efface le fichier avant tout appel à Gradle. Mesure à l'appui : sans
    // cela, une compilation cassée juste après une capture refusée faisait rendre 3 « capture non
    // conforme » à run.bat pour une erreur de compilation.
    // Seconde couture de verify-launcher.bat. Celle-ci fait echouer la construction AVANT que la
    // tache demarre, ce qui reproduit la forme exacte d'une compilation cassee : ni doFirst, ni
    // doLast, donc aucun effacement du fichier de code cote Gradle. C'est le seul moyen de prouver
    // que l'effacement fait par run.bat protege reellement d'un code perime -- sans elle, retirer
    // cet effacement laissait la suite entierement verte.
    if (System.getenv('STARFALL_FAIL_BEFORE_RUN') != null) {
        throw new GradleException("[Starfall] echec simule avant le lancement"
                + " (couture de verify-launcher.bat)")
    }

    // Le chemin vient de run.bat quand c'est lui qui lance, et il n'y a alors qu'une seule ecriture
    // de cette regle au lieu de deux. Le repli sert aux appels directs a « gradlew :lwjgl3:run ».
    def exitCodeFile = project.hasProperty('starfall.exitCodeFile')
            ? file(project.property('starfall.exitCodeFile'))
            : layout.buildDirectory.file('starfall-exit-code.txt').get().asFile

    doFirst {
        exitCodeFile.delete()
    }

    doLast {
        int code = executionResult.get().exitValue
        exitCodeFile.parentFile.mkdirs()
        exitCodeFile.text = String.valueOf(code)

        // Couture de verify-launcher.bat, et elle a une raison precise. Le defaut le plus retors de
        // la chaine des codes de sortie est le symetrique du plus evident : un jeu sorti PROPREMENT
        // pendant qu'une etape ulterieure de la construction echoue. run.bat rendait alors 0 -- un
        // code frais servi par-dessus un echec. Ce cas ne se produit pas en usage normal, donc
        // aucune suite d'appels au lanceur ne peut l'atteindre : sans cette couture, la regression
        // reviendrait sans que rien ne le dise. Une variable d'environnement plutot qu'une option,
        // parce qu'elle traverse run.bat et gradlew sans qu'aucun des deux ait a la connaitre.
        if (System.getenv('STARFALL_FAIL_AFTER_RUN') != null) {
            throw new GradleException("[Starfall] echec simule apres un jeu sorti en " + code
                    + " (couture de verify-launcher.bat)")
        }

        if (code != 0) {
            throw new GradleException("[Starfall] le jeu s'est terminé avec le code " + code
                    + " (" + starfallExitMeaning(code) + ")")
        }
    }
}

/** Les codes de sortie du jeu, en toutes lettres. Voir StarfallGame. */
static String starfallExitMeaning(int code) {
    switch (code) {
        case 1: return "plantage"
        case 2: return "ligne de commande invalide"
        case 3: return "capture non conforme à la taille demandée"
        default: return "code inattendu"
    }
}

/**
 * Le garde-fou d'image : ce que le jeu dessine vraiment, confronté à une référence.
 *
 * <p>Il répond au trou le plus profond du projet : la géométrie des repères tactiques est pure et
 * testée, mais rien ne vérifie que la scène lui passe les bons arguments. Une review l'a démontré en
 * inversant deux appels dans ArenaScene -- le héros regardant derrière lui, la cible fuyant le
 * héros -- sans qu'aucun des 461 tests ne bronche. Aucun test JUnit ne peut fermer ce trou : il
 * demande un contexte OpenGL. Une capture, elle, traverse toute la chaîne.
 *
 * <p>POURQUOI PAS captures/mN. Les planches-contact des jalons sont un témoin DATÉ ; les faire
 * servir de référence vivante reviendrait à réécrire l'histoire à chaque changement de rendu.
 * captures/reference n'a pas de date : elle dit « voici ce que le jeu dessine aujourd'hui », et
 * acceptRender ne la régénère que délibérément -- ce qui oblige à regarder les images.
 *
 * <p>SEPT ÉCRANS, ET C'EST TROIS FOIS UN CORRECTIF. La première version ne gardait que la vague 1
 * en grille 9. Une review a relevé que le SOUVERAIN -- la rencontre la plus dense à lire, celle qui
 * empile ruée, invocation et sbires -- n'avait aucune référence, ni la mire de calibration : c'était
 * garder le plus facile et laisser le plus difficile. Elle notait ensuite que les dix autres
 * LARGEURS restaient nues, alors que toute la géométrie de l'arène en dépend -- ArenaLayout calcule
 * chaque case à partir d'elle, et c'est précisément là qu'un décalage se voit. Les deux extrémités,
 * 5 et 15, ont donc été gardées aussi -- mais pour la seule vague 1, si bien que la justification
 * valait pour l'écran le plus simple et pas pour le plus dense. La rencontre finale est maintenant
 * gardée aux trois largeurs comme le reste.
 *
 * <p>Hors de « test » à dessein : ces tâches demandent un écran, la suite JUnit non.
 *
 *   gradlew :lwjgl3:verifyRender     confronte les cinq écrans à la référence
 *   gradlew :lwjgl3:acceptRender     adopte le rendu courant, après l'avoir regardé
 */
ext.renderScenarios = [
        arena          : ['--size', '1280x720', '--frames', '12', '--scene', 'arena'],
        arenaNarrow    : ['--size', '1280x720', '--frames', '4', '--scene', 'arena', '--grid', '5'],
        arenaWide      : ['--size', '1280x720', '--frames', '4', '--scene', 'arena', '--grid', '15'],
        sovereign      : ['--size', '1280x720', '--frames', '6', '--scene', 'arena', '--wave', '4'],
        sovereignNarrow: ['--size', '1280x720', '--frames', '4', '--scene', 'arena', '--wave', '4',
                          '--grid', '5'],
        sovereignWide  : ['--size', '1280x720', '--frames', '4', '--scene', 'arena', '--wave', '4',
                          '--grid', '15'],
        calibration    : ['--size', '1280x720', '--frames', '2', '--scene', 'calibration'],
]

ext.renderReferenceDir = rootProject.file('captures/reference')

/** Une tâche de rendu par scénario : JavaExec ne lance qu'un processus, et il en faut cinq. */
def registerRenderTask(String prefix, String scenario, List<String> scenarioArgs, File into) {
    tasks.register(prefix + scenario.capitalize(), JavaExec) {
        dependsOn tasks.named('classes'), ':core:generateAtlas'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.starfall.lwjgl3.Lwjgl3Launcher'
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        workingDir = rootProject.projectDir
        ignoreExitValue = true
        args = ['--screenshot', into.absolutePath] + scenarioArgs

        doFirst {
            into.deleteDir()
            into.mkdirs()
        }
        doLast {
            int code = executionResult.get().exitValue
            if (code != 0) {
                // Le code 3 a une cause banale qu'il vaut mieux nommer : sur un poste dont l'écran
                // est plus petit que 1280x720, la fenêtre est bornée par le système et la capture
                // n'a pas la taille demandée. Le garde-fou devient alors inutilisable, et la review
                // a relevé qu'aucun recours n'était écrit. Il n'y en a pas de bon : abaisser la
                // taille invaliderait la référence pour tout le monde. Ce qu'on peut faire, c'est
                // le dire au lieu de laisser chercher.
                def tooSmall = " -- l'écran est-il plus petit que la taille demandée ? " +
                        "La référence est calée sur 1280x720 et ne peut pas être vérifiée en dessous."
                def hint = (code == 3) ? tooSmall : ""
                throw new GradleException("[Starfall] rendu de l'écran « " + scenario
                        + " » interrompu, code " + code + " (" + starfallExitMeaning(code) + ")"
                        + hint)
            }
        }
    }
}

def checkDir = { String scenario -> layout.buildDirectory.dir('render-check/' + scenario).get().asFile }
def stageDir = { String scenario -> layout.buildDirectory.dir('render-accept/' + scenario).get().asFile }

renderScenarios.each { scenario, scenarioArgs ->
    registerRenderTask('renderCheck', scenario, scenarioArgs, checkDir(scenario))
    registerRenderTask('renderAccept', scenario, scenarioArgs, stageDir(scenario))
}

tasks.register('verifyRender') {
    group = 'verification'
    description = "Confronte les cinq écrans du jeu à captures/reference, octet à octet."
    dependsOn renderScenarios.keySet().collect { 'renderCheck' + it.capitalize() }

    doLast {
        def nl = String.valueOf((char) 10)
        def report = []
        int matched = 0

        renderScenarios.keySet().each { scenario ->
            def reference = new File(renderReferenceDir, scenario)
            def produced = checkDir(scenario)
            def expected = reference.isDirectory()
                    ? reference.listFiles().findAll { it.name.endsWith('.png') }.sort { it.name }
                    : []
            if (expected.isEmpty()) {
                report << ("  ecran « " + scenario + " » : aucune planche de reference dans " + reference)
                return
            }

            def differences = []
            def missing = []
            expected.each { file ->
                def actual = new File(produced, file.name)
                if (!actual.isFile()) {
                    missing << file.name
                } else if (!java.util.Arrays.equals(file.bytes, actual.bytes)) {
                    differences << file.name
                } else {
                    matched++
                }
            }
            def unexpected = produced.listFiles().findAll {
                it.name.endsWith('.png') && !new File(reference, it.name).isFile()
            }.collect { it.name }.sort()

            if (differences) report << ("  ecran « " + scenario + " » : planches differentes " + differences)
            if (missing)     report << ("  ecran « " + scenario + " » : planches manquantes " + missing)
            if (unexpected)  report << ("  ecran « " + scenario + " » : planches en trop " + unexpected)
        }

        // Un écran renommé laisse derrière lui un dossier de référence que plus personne ne
        // compare : il reste versionné, il a l'air d'une garantie, et il n'en est plus une. C'est le
        // même défaut que le sprite orphelin de l'atlas, et il se dit de la même façon.
        def known = renderScenarios.keySet()
        def orphans = renderReferenceDir.isDirectory()
                ? renderReferenceDir.listFiles().findAll { it.isDirectory() && !known.contains(it.name) }
                        .collect { it.name }.sort()
                : []
        if (orphans) {
            report << ("  references orphelines, plus comparees a rien : " + orphans)
        }

        if (report) {
            report.add(0, "[Starfall] le rendu ne correspond plus a la reference.")
            report << ("  produit dans : " + layout.buildDirectory.dir('render-check').get().asFile)
            report << "  Si le changement est VOULU, regarder les images puis lancer"
            report << "  « gradlew :lwjgl3:acceptRender » pour adopter le nouveau rendu."
            throw new GradleException(report.join(nl))
        }
        logger.lifecycle("[Starfall] rendu conforme a la reference : " + matched + " planches sur "
                + renderScenarios.size() + " ecrans.")
    }
}

tasks.register('acceptRender') {
    group = 'verification'
    description = "Remplace captures/reference par le rendu courant, apres l'avoir REGARDE."
    dependsOn renderScenarios.keySet().collect { 'renderAccept' + it.capitalize() }

    // La référence n'est touchée qu'UNE FOIS TOUS LES ÉCRANS RENDUS. La première version effaçait
    // le dossier dans un doFirst, avant de savoir si le jeu saurait le remplir : un plantage à la
    // capture laissait la référence VIDE -- la tâche « à ne lancer qu'après avoir regardé les
    // images » était aussi celle qui pouvait effacer les images qu'on allait regarder.
    doLast {
        def staged = [:]
        renderScenarios.keySet().each { scenario ->
            def produced = stageDir(scenario).listFiles().findAll { it.name.endsWith('.png') }
            if (!produced) {
                throw new GradleException("[Starfall] aucune planche produite pour l'écran « "
                        + scenario + " » -- la référence n'a PAS été touchée.")
            }
            staged[scenario] = produced
        }

        // Les dossiers d'écrans disparus partent avec, sinon la référence ne peut jamais redevenir
        // propre : verifyRender les signalerait à chaque exécution sans qu'aucune commande ne sache
        // les enlever. C'est annoncé, pas silencieux.
        def known = renderScenarios.keySet()
        renderReferenceDir.listFiles().findAll { it.isDirectory() && !known.contains(it.name) }
                .each { orphan ->
                    logger.lifecycle("[Starfall] reference orpheline retiree : " + orphan.name)
                    orphan.deleteDir()
                }

        int written = 0
        staged.each { scenario, produced ->
            def reference = new File(renderReferenceDir, scenario)
            reference.deleteDir()
            reference.mkdirs()
            produced.each { file ->
                new File(reference, file.name).bytes = file.bytes
                written++
            }
        }
        logger.lifecycle("[Starfall] reference remplacee : " + written + " planches sur "
                + staged.size() + " ecrans.")
    }
}

tasks.register('dist', Jar) {
    dependsOn configurations.runtimeClasspath
    archiveBaseName = 'Starfall'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
