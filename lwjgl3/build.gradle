// Desktop launcher (LWJGL3 backend).

apply plugin: 'application'

application {
    mainClass = 'com.starfall.lwjgl3.Lwjgl3Launcher'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl') {
            details.useVersion lwjglVersion
        }
    }
}

// Allow: gradlew :lwjgl3:run --args="--screenshot captures/m1 --size 1280x720"
tasks.named('run', JavaExec) {
    standardInput = System.in
    ignoreExitValue = false
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // Relative paths (e.g. --screenshot captures/m1) resolve against the project root.
    workingDir = rootProject.projectDir
}

tasks.register('dist', Jar) {
    dependsOn configurations.runtimeClasspath
    archiveBaseName = 'Starfall'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
