// Code de jeu indépendant du moteur. Ne dépend que de l'API libGDX, jamais d'un backend.

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Pipeline pixel art : les sources de verite sont les fichiers texte de art/,
// l'atlas PNG n'est qu'un produit derive, regenere a chaque build et jamais
// edite a la main. Voir com.starfall.art.AtlasBuilder.
//
// La tache vit ici, et pas a la racine, parce qu'elle a besoin du classpath de
// ce module : Gradle interdit desormais de resoudre la configuration d'un autre
// projet depuis le script racine.
tasks.register('generateAtlas', JavaExec) {
    group = 'starfall'
    description = "Convertit les sources texte de art/ en atlas PNG + index"

    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.starfall.art.AtlasBuilder'

    def artDir = rootProject.layout.projectDirectory.dir('art')
    def outputDir = rootProject.layout.projectDirectory.dir('assets/generated')
    args artDir.asFile.absolutePath, outputDir.asFile.absolutePath

    // Sans ces declarations, Gradle relancerait la tache a chaque build et,
    // pire, ne la relancerait pas apres une modification d'un .sprite.
    inputs.dir(artDir).withPropertyName('art')
    outputs.dir(outputDir).withPropertyName('atlas')
}

// « gradlew :core:build » seul ne declenchait pas la tache, alors qu'elle est definie ici : la
// documentation promettait « regenere a chaque build » et ce n'etait vrai que via :lwjgl3.
tasks.named('build') {
    dependsOn tasks.named('generateAtlas')
}

// Et les TESTS en dependent aussi, depuis que deux d'entre eux relisent l'atlas livre pour
// verifier qu'il correspond a ce que le jeu reclame.
//
// « build.dependsOn generateAtlas » ne suffisait pas : ca declare une dependance, pas un ORDRE.
// Gradle ordonnancait donc :core:test AVANT :core:generateAtlas, et comme assets/generated/ n'est
// pas versionne, la suite ne passait que sur une machine ou quelqu'un avait deja lance le jeu.
// Sur un depot fraichement clone, « gradlew test » ET « gradlew build » echouaient tous les deux.
//
// C'est le pire endroit ou se tromper : la commande que le tableau de bord donne au relecteur
// etait celle qui ne marchait pas chez lui.
tasks.named('test') {
    dependsOn tasks.named('generateAtlas')
}
